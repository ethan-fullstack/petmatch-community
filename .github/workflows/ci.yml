name: Java CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: petmatch_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Isolated database account
        run: >-
          docker exec ${{ job.services.mysql.id }} mysql -uroot -e
          "CREATE USER 'petmatch_test'@'%' IDENTIFIED BY ''; GRANT ALL ON petmatch_test.* TO 'petmatch_test'@'%';"
      - run: ./mvnw -B -ntp clean verify
        env:
          TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/petmatch_test
          TEST_DB_USERNAME: petmatch_test
          TEST_DB_PASSWORD: ''
      - name: Check form error accessibility associations
        run: python3 tools/check-accessibility.py
      - name: Verify browser smoke script syntax
        run: python3 -m py_compile tools/browser-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-coverage-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/report-query-performance.json
