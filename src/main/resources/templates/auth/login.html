<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Iniciar sesión | PetMatch Community')}"></head>
<body class="min-h-screen bg-slate-950 text-slate-100">
    <main class="mx-auto flex min-h-screen max-w-xl items-center px-6 py-16">
        <section class="w-full rounded-3xl border border-slate-800 bg-slate-900/80 p-8 shadow-2xl shadow-cyan-950/20">
            <p class="text-sm font-semibold uppercase tracking-[0.2em] text-cyan-300">PetMatch Community</p>
            <h1 class="mt-3 text-3xl font-black text-white">Iniciar sesión</h1>
            <p class="mt-2 text-slate-400">Accede con el correo y la contraseña de tu cuenta.</p>

            <p class="mt-6 rounded-xl border border-emerald-400/20 bg-emerald-400/10 p-3 text-sm text-emerald-100" th:if="${param.registered}">Tu cuenta fue creada correctamente.</p>
            <p class="mt-6 rounded-xl border border-emerald-400/20 bg-emerald-400/10 p-3 text-sm text-emerald-100" th:if="${param.logout}">Sesión cerrada correctamente.</p>
            <p class="mt-6 rounded-xl border border-rose-400/20 bg-rose-400/10 p-3 text-sm text-rose-100" th:if="${param.error}">Correo o contraseña incorrectos.</p>

            <form th:action="@{/login}" method="post" class="mt-8 space-y-5">
                <div>
                    <label for="email" class="mb-2 block text-sm font-semibold text-slate-200">Correo</label>
                    <input id="email" name="email" type="email" autocomplete="email" required class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-white outline-none transition placeholder:text-slate-600 focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/20">
                </div>

                <div>
                    <label for="password" class="mb-2 block text-sm font-semibold text-slate-200">Contraseña</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-white outline-none transition focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/20">
                </div>

                <button type="submit" class="w-full rounded-xl bg-cyan-400 px-5 py-3 font-bold text-slate-950 transition hover:bg-cyan-300">Ingresar</button>
            </form>

            <div class="mt-6 space-y-2 text-sm text-slate-400">
                <p>¿Aún no tienes cuenta? <a th:href="@{/register}" class="font-semibold text-cyan-300 hover:text-cyan-200">Regístrate</a></p>
                <p><a th:href="@{/}" class="font-semibold text-slate-300 hover:text-white">Volver al inicio</a></p>
            </div>
        </section>
    </main>
</body>
</html>
