<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Registro | PetMatch Community')}"></head>
<body class="min-h-screen bg-slate-950 text-slate-100">
    <main class="mx-auto flex min-h-screen max-w-xl items-center px-6 py-16">
        <section class="w-full rounded-3xl border border-slate-800 bg-slate-900/80 p-8 shadow-2xl shadow-cyan-950/20">
            <p class="text-sm font-semibold uppercase tracking-[0.2em] text-cyan-300">PetMatch Community</p>
            <h1 class="mt-3 text-3xl font-black text-white">Crear cuenta</h1>
            <p class="mt-2 text-slate-400">Regístrate para publicar solicitudes y participar en la comunidad.</p>

            <form th:action="@{/register}" th:object="${registrationForm}" method="post" class="mt-8 space-y-5">
                <div>
                    <label for="name" class="mb-2 block text-sm font-semibold text-slate-200">Nombre</label>
                    <input id="name" type="text" th:field="*{name}" autocomplete="name" class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-white outline-none transition focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/20">
                    <p class="mt-2 text-sm text-rose-300" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
                </div>

                <div>
                    <label for="email" class="mb-2 block text-sm font-semibold text-slate-200">Correo</label>
                    <input id="email" type="email" th:field="*{email}" autocomplete="email" class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-white outline-none transition focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/20">
                    <p class="mt-2 text-sm text-rose-300" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
                </div>

                <div>
                    <label for="password" class="mb-2 block text-sm font-semibold text-slate-200">Contraseña</label>
                    <input id="password" type="password" th:field="*{password}" autocomplete="new-password" class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-white outline-none transition focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/20">
                    <p class="mt-2 text-sm text-rose-300" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
                </div>

                <div>
                    <label for="confirmPassword" class="mb-2 block text-sm font-semibold text-slate-200">Confirmar contraseña</label>
                    <input id="confirmPassword" type="password" th:field="*{confirmPassword}" autocomplete="new-password" class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-white outline-none transition focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/20">
                    <p class="mt-2 text-sm text-rose-300" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></p>
                </div>

                <button type="submit" class="w-full rounded-xl bg-cyan-400 px-5 py-3 font-bold text-slate-950 transition hover:bg-cyan-300">Crear cuenta</button>
            </form>

            <div class="mt-6 space-y-2 text-sm text-slate-400">
                <p>¿Ya tienes cuenta? <a th:href="@{/login}" class="font-semibold text-cyan-300 hover:text-cyan-200">Inicia sesión</a></p>
                <p><a th:href="@{/}" class="font-semibold text-slate-300 hover:text-white">Volver al inicio</a></p>
            </div>
        </section>
    </main>
</body>
</html>
