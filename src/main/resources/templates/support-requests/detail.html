<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${request.title + ' | PetMatch Community'})}"></head>
<body class="min-h-screen bg-slate-950 text-slate-100">
<main class="mx-auto max-w-4xl px-6 py-10">
    <nav th:replace="~{fragments/navigation :: appNavigation}"></nav>
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <section class="mt-6 rounded-3xl border border-slate-800 bg-slate-900 p-8 sm:p-10">
        <div class="flex flex-col gap-5 sm:flex-row sm:items-start sm:justify-between">
            <div>
                <div class="flex flex-wrap gap-2">
                    <span class="rounded-full bg-cyan-400/10 px-3 py-1 text-xs font-bold text-cyan-300" th:text="${request.supportType}"></span>
                    <span class="rounded-full bg-slate-800 px-3 py-1 text-xs font-bold text-slate-300" th:text="${request.status}"></span>
                </div>
                <h1 class="mt-4 text-4xl font-black text-white" th:text="${request.title}"></h1>
                <p class="mt-3 text-slate-400">Para <strong class="text-slate-200" th:text="${request.pet.name}"></strong> · publicado por <span th:text="${request.owner.name}"></span></p>
            </div>
            <div class="text-5xl">🐾</div>
        </div>

        <div class="mt-8 grid gap-4 rounded-2xl bg-slate-950/60 p-5 sm:grid-cols-2">
            <div><p class="text-xs font-bold uppercase tracking-wide text-slate-500">Fecha del apoyo</p><p class="mt-1 font-semibold text-white" th:text="${request.serviceDate}"></p></div>
            <div><p class="text-xs font-bold uppercase tracking-wide text-slate-500">Estado</p><p class="mt-1 font-semibold text-white" th:text="${request.status}"></p></div>
        </div>

        <div class="mt-8">
            <h2 class="text-sm font-bold uppercase tracking-[0.2em] text-slate-500">Descripción</h2>
            <p class="mt-4 whitespace-pre-line leading-7 text-slate-300" th:text="${request.description}"></p>
        </div>

        <div th:if="${ownerView}" class="mt-10 flex flex-wrap gap-3 border-t border-slate-800 pt-6">
            <a th:if="${request.status.name() == 'OPEN'}" th:href="@{/support-requests/{id}/edit(id=${request.id})}" class="rounded-xl bg-cyan-400 px-5 py-3 font-bold text-slate-950">Editar solicitud</a>
            <a th:href="@{/support-applications/request/{id}(id=${request.id})}" class="rounded-xl border border-cyan-400/30 px-5 py-3 font-semibold text-cyan-300">Ver postulaciones</a>
            <form th:if="${request.status.name() == 'OPEN'}" th:action="@{/support-requests/{id}/cancel(id=${request.id})}" method="post">
                <button type="submit" class="rounded-xl border border-rose-400/30 px-5 py-3 font-semibold text-rose-300">Cancelar solicitud</button>
            </form>
            <form th:if="${request.status.name() == 'IN_PROGRESS'}" th:action="@{/support-requests/{id}/complete(id=${request.id})}" method="post">
                <button type="submit" class="rounded-xl bg-emerald-400 px-5 py-3 font-bold text-slate-950">Marcar como completada</button>
            </form>
            <a th:href="@{/support-requests/mine}" class="rounded-xl border border-slate-700 px-5 py-3 font-semibold">Mis solicitudes</a>
        </div>

        <div th:if="${!ownerView and request.status.name() == 'OPEN'}" class="mt-10 border-t border-slate-800 pt-6">
            <a th:href="@{/support-applications/request/{id}/new(id=${request.id})}" class="inline-flex rounded-xl bg-cyan-400 px-5 py-3 font-bold text-slate-950 hover:bg-cyan-300">Postularme para ayudar</a>
        </div>

        <div th:if="${!ownerView and request.status.name() != 'OPEN'}" class="mt-10 rounded-2xl border border-slate-700 bg-slate-950/50 p-5 text-slate-300">
            Esta solicitud ya no recibe nuevas postulaciones.
        </div>
    </section>
</main>
</body>
</html>
