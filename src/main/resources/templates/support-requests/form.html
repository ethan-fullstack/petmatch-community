<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${editing ? 'Editar solicitud | PetMatch Community' : 'Nueva solicitud | PetMatch Community'})}"></head>
<body class="min-h-screen bg-slate-950 text-slate-100">
    <a href="#main-content" class="skip-link">Saltar al contenido</a>
    <main id="main-content" tabindex="-1" class="mx-auto max-w-3xl px-6 py-10">
        <nav th:replace="~{fragments/navigation :: appNavigation}"></nav>

        <section class="rounded-3xl border border-slate-800 bg-slate-900 p-8">
            <h1 class="text-3xl font-black text-white" th:text="${editing ? 'Editar solicitud' : 'Nueva solicitud de apoyo'}"></h1>
            <p class="mt-2 text-slate-400">Describe qué apoyo necesitas y para qué mascota.</p>

            <div th:if="${pets.isEmpty()}" class="mt-6 rounded-xl border border-amber-400/30 bg-amber-400/10 p-4 text-amber-100">
                Primero debes registrar una mascota. <a th:href="@{/pets/new}" class="font-bold underline">Crear mascota</a>
            </div>

            <form th:action="${editing} ? @{/support-requests/{id}(id=${request.id})} : @{/support-requests}" th:object="${supportRequestForm}" method="post" class="mt-8 space-y-5" th:if="${!pets.isEmpty()}">
                <div>
                    <label for="title" class="mb-2 block font-semibold">Título</label>
                    <input id="title" type="text" th:field="*{title}" th:attr="aria-invalid=${#fields.hasErrors('title')},aria-describedby=${#fields.hasErrors('title') ? 'title-error' : null}" class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 outline-none focus:border-cyan-400">
                    <p class="mt-1 text-sm text-rose-300" th:if="${#fields.hasErrors('title')}" id="title-error" role="alert" th:errors="*{title}"></p>
                </div>

                <div>
                    <label for="description" class="mb-2 block font-semibold">Descripción</label>
                    <textarea id="description" th:field="*{description}" th:attr="aria-invalid=${#fields.hasErrors('description')},aria-describedby=${#fields.hasErrors('description') ? 'description-error' : null}" rows="6" class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 outline-none focus:border-cyan-400"></textarea>
                    <p class="mt-1 text-sm text-rose-300" th:if="${#fields.hasErrors('description')}" id="description-error" role="alert" th:errors="*{description}"></p>
                </div>

                <div class="grid gap-5 sm:grid-cols-2">
                    <div>
                        <label for="supportType" class="mb-2 block font-semibold">Tipo de apoyo</label>
                        <select id="supportType" th:field="*{supportType}" th:attr="aria-invalid=${#fields.hasErrors('supportType')},aria-describedby=${#fields.hasErrors('supportType') ? 'supportType-error' : null}" class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3">
                            <option value="">Selecciona</option>
                            <option th:each="type : ${supportTypes}" th:value="${type}" th:text="${type}"></option>
                        </select>
                        <p class="mt-1 text-sm text-rose-300" th:if="${#fields.hasErrors('supportType')}" id="supportType-error" role="alert" th:errors="*{supportType}"></p>
                    </div>
                    <div>
                        <label for="petId" class="mb-2 block font-semibold">Mascota</label>
                        <select id="petId" th:field="*{petId}" th:attr="aria-invalid=${#fields.hasErrors('petId')},aria-describedby=${#fields.hasErrors('petId') ? 'petId-error' : null}" class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3">
                            <option value="">Selecciona</option>
                            <option th:each="pet : ${pets}" th:value="${pet.id}" th:text="${pet.name + ' · ' + pet.species}"></option>
                        </select>
                        <p class="mt-1 text-sm text-rose-300" th:if="${#fields.hasErrors('petId')}" id="petId-error" role="alert" th:errors="*{petId}"></p>
                    </div>
                </div>

                <div>
                    <label for="serviceDate" class="mb-2 block font-semibold">Fecha y hora del apoyo</label>
                    <input id="serviceDate" type="datetime-local" th:field="*{serviceDate}" th:attr="aria-invalid=${#fields.hasErrors('serviceDate')},aria-describedby=${#fields.hasErrors('serviceDate') ? 'serviceDate-error' : null}" class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3">
                    <p class="mt-1 text-sm text-rose-300" th:if="${#fields.hasErrors('serviceDate')}" id="serviceDate-error" role="alert" th:errors="*{serviceDate}"></p>
                </div>

                <button type="submit" class="rounded-xl bg-cyan-400 px-5 py-3 font-bold text-slate-950 hover:bg-cyan-300" th:text="${editing ? 'Guardar cambios' : 'Publicar solicitud'}"></button>
            </form>
        </section>
    </main>
</body>
</html>
