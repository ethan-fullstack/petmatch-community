<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Postularme | PetMatch Community')}"></head>
<body class="min-h-screen bg-slate-950 text-slate-100">
<a href="#main-content" class="skip-link">Saltar al contenido</a>
    <main id="main-content" tabindex="-1" class="mx-auto max-w-3xl px-6 py-10">
    <nav th:replace="~{fragments/navigation :: appNavigation}"></nav>

    <section class="rounded-3xl border border-slate-800 bg-slate-900 p-8">
        <p class="text-sm font-bold uppercase tracking-[0.2em] text-cyan-300">Postulación</p>
        <h1 class="mt-3 text-3xl font-black" th:text="${request.title}"></h1>
        <p class="mt-2 text-slate-400">Ayudarás con <strong th:text="${request.pet.name}"></strong>.</p>

        <form th:action="@{/support-applications/request/{id}(id=${request.id})}" th:object="${supportApplicationForm}" method="post" class="mt-8 space-y-5">
            <div th:if="${#fields.hasGlobalErrors()}" class="rounded-xl border border-rose-400/30 bg-rose-400/10 p-4 text-rose-100">
                <p th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
            </div>
            <div>
                <label for="message" class="block text-sm font-bold text-slate-200">Mensaje (opcional)</label>
                <textarea id="message" th:field="*{message}" th:attr="aria-invalid=${#fields.hasErrors('message')},aria-describedby=${#fields.hasErrors('message') ? 'message-error' : null}" rows="6" class="mt-2 w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 outline-none focus:border-cyan-400" placeholder="Cuéntale al propietario por qué puedes ayudar."></textarea>
                <p th:if="${#fields.hasErrors('message')}" id="message-error" role="alert" th:errors="*{message}" class="mt-2 text-sm text-rose-300"></p>
            </div>
            <button class="rounded-xl bg-cyan-400 px-5 py-3 font-bold text-slate-950 hover:bg-cyan-300" type="submit">Enviar postulación</button>
        </form>
    </section>
</main>
</body>
</html>
