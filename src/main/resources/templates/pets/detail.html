<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pet.name + ' | PetMatch Community'})}"></head>
<body class="min-h-screen bg-slate-950 text-slate-100">
    <main class="mx-auto max-w-4xl px-6 py-10">
        <nav th:replace="~{fragments/navigation :: appNavigation}"></nav>
        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <section class="mt-6 overflow-hidden rounded-3xl border border-slate-800 bg-slate-900 shadow-2xl shadow-black/20">
            <div class="border-b border-slate-800 bg-gradient-to-br from-cyan-400/15 to-transparent p-8 sm:p-10">
                <div class="flex flex-col gap-6 sm:flex-row sm:items-start sm:justify-between">
                    <div>
                        <span class="inline-flex rounded-full bg-cyan-400/10 px-3 py-1 text-xs font-bold uppercase tracking-wide text-cyan-300" th:text="${pet.species}"></span>
                        <h1 class="mt-4 text-4xl font-black text-white sm:text-5xl" th:text="${pet.name}"></h1>
                        <p class="mt-3 text-lg text-slate-300"><span th:text="${pet.age}"></span> años</p>
                    </div>
                    <div class="text-6xl">🐾</div>
                </div>
            </div>

            <div class="p-8 sm:p-10">
                <h2 class="text-sm font-bold uppercase tracking-[0.2em] text-slate-500">Descripción</h2>
                <p class="mt-4 whitespace-pre-line leading-7 text-slate-300" th:text="${pet.description != null ? pet.description : 'No se agregó una descripción para esta mascota.'}"></p>

                <div class="mt-10 flex flex-wrap gap-3 border-t border-slate-800 pt-6">
                    <a th:href="@{/support-requests/new(petId=${pet.id})}" class="rounded-xl bg-emerald-400 px-5 py-3 font-bold text-slate-950 transition hover:bg-emerald-300">Solicitar apoyo</a>
                    <a th:href="@{/pets/{id}/edit(id=${pet.id})}" class="rounded-xl bg-cyan-400 px-5 py-3 font-bold text-slate-950 transition hover:bg-cyan-300">Editar mascota</a>
                    <form th:action="@{/pets/{id}/delete(id=${pet.id})}" method="post">
                        <button type="submit" class="rounded-xl border border-rose-400/30 px-5 py-3 font-semibold text-rose-300 transition hover:bg-rose-400/10">Eliminar mascota</button>
                    </form>
                </div>

                <p class="mt-4 text-sm text-slate-500">Cuando existan solicitudes de apoyo asociadas, la mascota ya no podrá eliminarse.</p>
            </div>
        </section>
    </main>
</body>
</html>
