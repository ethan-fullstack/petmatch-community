<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="alerts" class="space-y-3">
    <div th:if="${successMessage}"
         class="rounded-xl border border-emerald-400/30 bg-emerald-400/10 p-4 text-emerald-100"
         th:text="${successMessage}"></div>

    <div th:if="${errorMessage}"
         class="rounded-xl border border-rose-400/30 bg-rose-400/10 p-4 text-rose-100"
         th:text="${errorMessage}"></div>
</div>
</body>
</html>
